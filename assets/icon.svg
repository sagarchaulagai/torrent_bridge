<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#FFB052"/>
      <stop offset="50%" stop-color="#FF7A1A"/>
      <stop offset="100%" stop-color="#E8500A"/>
    </linearGradient>
    <radialGradient id="shine" cx="25%" cy="12%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity=".38"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity=".55"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#7A2200" stop-opacity=".25"/>
    </linearGradient>
    <linearGradient id="play" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFE3C7"/>
    </linearGradient>
    <filter id="drop" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="11" flood-color="#8A2900" flood-opacity=".5"/>
    </filter>
    <filter id="dropSoft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#8A2900" flood-opacity=".35"/>
    </filter>
    <clipPath id="squircle">
      <rect id="sq" width="512" height="512"/>
    </clipPath>
  </defs>

  <!-- Squircle background -->
  <g clip-path="url(#squircle)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <rect width="512" height="512" fill="url(#shine)"/>
    <!-- soft light arc along the bottom for depth -->
    <ellipse cx="256" cy="560" rx="360" ry="190" fill="#FFFFFF" opacity=".07"/>
  </g>
  <rect x="1.5" y="1.5" width="509" height="509"
        fill="none" stroke="url(#edge)" stroke-width="3"/>

  <g transform="translate(-16 0)">
    <!-- Play triangle (rounded corners via thick round-joined stroke) -->
    <path d="M170 170 L170 342 L300 256 Z"
          fill="url(#play)" stroke="url(#play)" stroke-width="28"
          stroke-linejoin="round" filter="url(#drop)"/>

    <!-- Broadcast / "served on localhost" waves -->
    <g fill="none" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round"
       filter="url(#dropSoft)">
      <path d="M344.4 218.7 A58 58 0 0 1 344.4 293.3" opacity=".95"/>
      <path d="M376.6 191.7 A100 100 0 0 1 376.6 320.3" opacity=".6"/>
    </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
